<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Notch Two</title>
  <desc id="desc">A focused Mac workspace set around a black notch, with music, calendar, a file shelf, and a focus timer.</desc>
  <rect width="1200" height="360" rx="28" fill="#101113"/>
  <path d="M0 92h1200M0 286h1200" stroke="#25272a" stroke-width="1"/>
  <text x="64" y="67" fill="#8d9299" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">A SMALL WORKSPACE ABOVE YOUR SCREEN</text>
  <text x="62" y="158" fill="#f4f5f6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Notch Two</text>
  <text x="65" y="201" fill="#b5bac1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Music, files, calendar and focus.</text>
  <text x="65" y="238" fill="#b5bac1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Right where you already look.</text>
  <text x="65" y="326" fill="#737982" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">INDEPENDENT macOS FORK  ·  APPLE SILICON</text>

