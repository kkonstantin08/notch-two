  <path d="M824 35v18c0 35 17 51 50 51h86c33 0 50-16 50-51V35" fill="#050506"/>
  <rect x="864" y="75" width="52" height="5" rx="2.5" fill="#4e8cff"/>
  <circle cx="938" cy="77.5" r="3" fill="#383b40"/>

