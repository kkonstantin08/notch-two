name: Bug report
description: Report a reproducible Notch Two issue.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Include steps to reproduce the issue and attach a screenshot or short recording when helpful.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Notch Two version
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
